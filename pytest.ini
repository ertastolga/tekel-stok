[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers -m "not perf"
markers =
    ui: PySide6 gerektiren arayüz testleri (offscreen çalışır)
    slow: uzun süren testler
    perf: büyük veri / duvar saati bütçe testleri (varsayılan çalıştırmada YOK; "-m perf" ile)
filterwarnings =
    error::DeprecationWarning:app.*
